# Example: run SkillTotal on every push and pull request, and surface findings in the
# repository's Security -> Code scanning tab. Copy this to .github/workflows/skilltotal.yml.
name: SkillTotal
on: [push, pull_request]

permissions:
  contents: read
  security-events: write   # required for the SARIF upload to Code Scanning
  actions: read            # required for the SARIF upload in a private repository

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pezhik/skilltotal@v0.73.0
        with:
          source: .            # a path in the repo, a git URL, or an npm:/pypi:<name> spec
          fail-on: high        # fail on a high/critical risk finding; use 'none' to report only
          # fail-on empty (the default) uses the gate of the repository's .skilltotal.toml, else high
          # version: 0.73.0    # the tag above already pins the engine; this runs another PyPI release (optional)
          # baseline: .skilltotal-baseline.json   # suppress accepted findings (optional)
          # fail-on-score: 50  # also fail at or above this risk score (optional)
          # exclude: |         # skip paths, one glob per line (optional)
          #   vendor/*
          # config: none       # ignore the repository's .skilltotal.toml (default: use it if present)
          # sarif-category: skilltotal/app   # Code Scanning category (default: set for a subfolder source)
          # comment-on-pr: 'true'            # summary comment on pull requests (needs pull-requests: write)
          # upload-sarif: 'false'            # a private repository without GitHub Advanced Security
