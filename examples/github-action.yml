# Example: run SkillTotal on every push and pull request, and surface findings in the
# repository's Security -> Code scanning tab. Copy this to .github/workflows/skilltotal.yml.
name: SkillTotal
on: [push, pull_request]

permissions:
  contents: read
  security-events: write   # required for the SARIF upload to Code Scanning
  actions: read            # required for the SARIF upload in a private repository

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pezhik/skilltotal@v0.68.0
        with:
          source: .            # a path in the repo, a git URL, or an npm:/pypi:<name> spec
          fail-on: high        # fail on a high/critical risk finding; use 'none' to report only
          # version: 0.68.0    # pin the engine for reproducible CI (optional)
          # baseline: .skilltotal-baseline.json   # suppress accepted findings (optional)
