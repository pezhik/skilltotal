name: "SkillTotal AI Component Security Scan"
# GitHub Marketplace requires description <= 125 chars; the full pitch lives in the README.
description: "Static security scan for AI components (MCP, agent skills, npm/PyPI, repos) - SARIF, deterministic, no LLM."
author: "SkillTotal"
branding:
  icon: "shield"
  color: "purple"

inputs:
  source:
    description: "What to scan: a path in the repo (default '.'), a git URL, or an npm:/pypi:<name> spec. SARIF from a git URL or a registry package is not uploaded: its alerts would point at files this repository does not have."
    required: false
    default: "."
  version:
    description: "Install this skilltotal version from PyPI. Empty runs the engine that ships with this action's ref (no download). The inputs of this action need an engine at least as new as the action."
    required: false
    default: ""
  fail-on:
    description: "Fail the job on a finding at or above this severity: 'low', 'medium', 'high', 'critical' or 'none'. Malicious indicators fail it at any severity; a capability (what a component can do, such as running a shell) never does. Empty (the default) uses the gate of the applied .skilltotal.toml (fail_on / fail_on_score) when it sets one, else 'high'. A level set here overrides the config's fail_on; 'none' turns off every gate the config sets (fail_on, fail_on_score, fail_on_unanalyzed, block policies), while 'fail-on-score' and 'fail-on-unanalyzed' set here still apply."
    required: false
    default: ""
  fail-on-score:
    description: "Also fail the job when the risk score is at or above this number (0-100). Empty: no score gate unless the config sets fail_on_score. Overrides the config's fail_on_score."
    required: false
    default: ""
  fail-on-unanalyzed:
    description: "Fail the job when a file, or a part of one, was not analyzed: 'true' or 'false'."
    required: false
    default: "false"
  exclude:
    description: "Path globs to skip, relative to 'source', separated by newlines or commas (added to the config's exclude)."
    required: false
    default: ""
  config:
    description: "Path to a .skilltotal.toml. Empty (the default) reads .skilltotal.toml from the working directory when there is one; 'none' ignores any config. An applied config is named in the log, since a pull request can change it."
    required: false
    default: ""
  upload-sarif:
    description: "Upload SARIF to GitHub Code Scanning (job needs 'security-events: write')."
    required: false
    default: "true"
  sarif-category:
    description: "Code Scanning category of the uploaded SARIF. Empty: none for source '.', else 'skilltotal/<source>', so two scans in one job keep their alerts apart."
    required: false
    default: ""
  comment-on-pr:
    description: "Post a summary comment on pull requests (job needs 'pull-requests: write')."
    required: false
    default: "false"
  baseline:
    description: "Optional path to a baseline file to suppress accepted findings."
    required: false
    default: ""
  sarif-file:
    description: "Where to write the SARIF report."
    required: false
    default: "skilltotal.sarif"

outputs:
  sarif-file:
    description: "Path to the generated SARIF report."
    value: ${{ inputs.sarif-file }}
  risk-score:
    description: "Risk score, 0-100."
    value: ${{ steps.scan.outputs.risk-score }}
  risk-level:
    description: "Risk level: low / medium / high / critical."
    value: ${{ steps.scan.outputs.risk-level }}
  verdict:
    description: "Verdict level: malicious when a malicious indicator was found (at any risk score), else critical, high, medium or low."
    value: ${{ steps.scan.outputs.verdict }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    # Inputs reach the shell only through env, never as `${{ }}` inside `run:`: a workflow that
    # passes untrusted text (an issue title, a PR branch name) as `source` must not be able to
    # inject shell into the consumer's runner.
    - name: Install SkillTotal
      if: ${{ inputs.version != '' }}
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: python -P -m pip install --upgrade "skilltotal==$INPUT_VERSION"

    - name: Scan
      id: scan
      shell: bash
      env:
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FAIL_ON_SCORE: ${{ inputs.fail-on-score }}
        INPUT_FAIL_ON_UNANALYZED: ${{ inputs.fail-on-unanalyzed }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        INPUT_SARIF_CATEGORY: ${{ inputs.sarif-category }}
      run: |
        set -o pipefail
        # With no version pinned, run the engine that ships with this action's ref: it has no
        # runtime dependencies, so a tag or SHA pin of the action pins the scanner code too,
        # and nothing is downloaded from PyPI. `-P` keeps the working directory -- the repository
        # being scanned, possibly an untrusted PR -- off sys.path, so a `skilltotal/` or `json.py`
        # planted there cannot stand in for the scanner or the stdlib.
        if [ -n "$INPUT_VERSION" ]; then
          ST=(skilltotal)
        else
          ST=(env PYTHONPATH="$GITHUB_ACTION_PATH" python -P -m skilltotal)
        fi
        BASE=()
        if [ -n "$INPUT_BASELINE" ]; then BASE+=(--baseline "$INPUT_BASELINE"); fi
        # The config: auto-discovered (empty), a named file, or none at all. Whichever applies is
        # named in the log by the scan itself.
        case "$INPUT_CONFIG" in
          "") ;;
          none|None|NONE) BASE+=(--no-config) ;;
          *) BASE+=(--config "$INPUT_CONFIG") ;;
        esac
        # Excludes: one glob per line or comma; blanks around each are dropped.
        while IFS= read -r GLOB; do
          GLOB="${GLOB#"${GLOB%%[![:space:]]*}"}"
          GLOB="${GLOB%"${GLOB##*[![:space:]]}"}"
          if [ -n "$GLOB" ]; then BASE+=(--exclude "$GLOB"); fi
        done < <(printf '%s\n' "$INPUT_EXCLUDE" | tr ',' '\n')
        # The action's own reports are not part of the component. The SARIF file is written into
        # the workspace (the upload step reads it there), and with `source: .` that is inside the
        # tree being scanned: the second scan read the first one's rule descriptions (detection
        # patterns quoted as text) and failed a clean repository. So the SARIF file is excluded
        # from both scans, and the JSON report the gate reads is written outside the workspace.
        # An exclude matches paths inside the scanned folder, so the SARIF path is given relative
        # to `source` (`source: repo` with `sarif-file: repo/skilltotal.sarif` is `skilltotal.sarif`),
        # with glob characters escaped. `-I`, as everywhere here: the working directory is the
        # repository being scanned, and an `os.py` planted there must not be imported.
        SARIF_EXCLUDE="$(python -I -c 'import os, sys; rel = os.path.relpath(os.path.abspath(sys.argv[1]), os.path.abspath(sys.argv[2])).replace(os.sep, "/"); print("".join("[" + c + "]" if c in "*?[" else c for c in rel))' "$INPUT_SARIF_FILE" "$INPUT_SOURCE")"
        BASE+=(--exclude "$SARIF_EXCLUDE")
        REPORT_JSON="${RUNNER_TEMP:-/tmp}/skilltotal.json"
        echo "report-json=$REPORT_JSON" >> "$GITHUB_OUTPUT"

        # Code Scanning resolves a SARIF location against the repository root, and the scan
        # writes paths relative to `source`: a scan of `app/` must say `app/x.py`, not `x.py`.
        # A git URL or a registry package is not in this repository at all, so its SARIF is
        # written but not uploaded (its alerts would point at files the repository does not have).
        SARIF_ARGS=()
        PREFIX=""
        shopt -s nocasematch
        case "$INPUT_SOURCE" in
          npm:*|pypi:*|http://*|https://*|git@*|ssh://*|git://*|git+*) SARIF_UPLOAD=false ;;
          *) SARIF_UPLOAD=true ;;
        esac
        shopt -u nocasematch
        if [ "$SARIF_UPLOAD" = true ]; then
          PREFIX="$(python -I -c 'import os, sys; src = os.path.abspath(sys.argv[1]); src = src if os.path.isdir(src) else os.path.dirname(src); rel = os.path.relpath(src, os.path.abspath(sys.argv[2])).replace(os.sep, "/"); print("" if rel == "." or rel == ".." or rel.startswith("../") else rel)' "$INPUT_SOURCE" "${GITHUB_WORKSPACE:-$PWD}")"
          if [ -n "$PREFIX" ]; then SARIF_ARGS+=(--sarif-uri-prefix "$PREFIX"); fi
        else
          echo "SkillTotal: '$INPUT_SOURCE' is not a path in this repository, so its SARIF report is not uploaded to Code Scanning (the alerts would point at files the repository does not have)."
        fi
        echo "sarif-upload=$SARIF_UPLOAD" >> "$GITHUB_OUTPUT"
        CATEGORY="$INPUT_SARIF_CATEGORY"
        if [ -z "$CATEGORY" ] && [ -n "$PREFIX" ]; then CATEGORY="skilltotal/$PREFIX"; fi
        if [ -n "$CATEGORY" ]; then SARIF_ARGS+=(--sarif-category "$CATEGORY"); fi

        # --fail-on counts what is risk: malicious indicators at any severity, risky constructs
        # and shipped secrets at theirs, and never a capability on its own (a shell call or
        # network access is what many tools exist to do).
        # Empty: the config's gate when it sets one, else high (--fail-on-default). `none`: no
        # gate from the config either (--fail-on none).
        # An unknown level must fail loudly, never silently switch the gate off.
        GATE=()
        FAIL_ON="$(printf '%s' "$INPUT_FAIL_ON" | tr '[:upper:]' '[:lower:]')"
        case "$FAIL_ON" in
          "") GATE+=(--fail-on-default high) ;;
          none|low|medium|high|critical) GATE+=(--fail-on "$FAIL_ON") ;;
          *) echo "::error::fail-on must be low, medium, high, critical or none (or empty for the config's gate, else high) (got '$INPUT_FAIL_ON')"
             echo "gate-exit=1" >> "$GITHUB_OUTPUT"
             exit 0 ;;
        esac
        if [ -n "$INPUT_FAIL_ON_SCORE" ]; then GATE+=(--fail-on-score "$INPUT_FAIL_ON_SCORE"); fi
        FAIL_UNANALYZED="$(printf '%s' "$INPUT_FAIL_ON_UNANALYZED" | tr '[:upper:]' '[:lower:]')"
        case "$FAIL_UNANALYZED" in
          false) ;;
          true) GATE+=(--fail-on-unanalyzed) ;;
          *) echo "::error::fail-on-unanalyzed must be true or false (got '$INPUT_FAIL_ON_UNANALYZED')"
             echo "gate-exit=1" >> "$GITHUB_OUTPUT"
             exit 0 ;;
        esac

        # From here on the log carries text from the scanned files (snippets, file names). The
        # runner reads a line that starts with `::` as a workflow command, so commands are off
        # until the findings are printed: a file cannot raise an annotation, mask a value or
        # forge "gate passed". The token is random, so the scanned text cannot turn them back on.
        STOP_TOKEN="$(python -I -c 'import secrets; print(secrets.token_hex(16))')"
        echo "::stop-commands::$STOP_TOKEN"

        # SARIF report for Code Scanning (not gated, so the upload always has a file).
        "${ST[@]}" scan "$INPUT_SOURCE" --sarif --output "$INPUT_SARIF_FILE" "${BASE[@]}" "${SARIF_ARGS[@]}" || true

        # JSON run drives the outputs AND the gate. --output is written before the gate exits,
        # so the JSON file exists even when the gate trips. Capture the exit code, don't abort here.
        # `|| GATE_EXIT=$?` is load-bearing. GitHub runs `shell: bash` as `bash -eo pipefail`, so a
        # bare failing command aborts the step immediately: the assignment below never ran and the
        # outputs were left empty exactly when a finding had been found. `||` suppresses `-e`.
        GATE_EXIT=0
        "${ST[@]}" scan "$INPUT_SOURCE" --json --output "$REPORT_JSON" "${BASE[@]}" "${GATE[@]}" \
          || GATE_EXIT=$?

        # Parse risk via stdlib in one process (never pipe python -> python on any host); `-I` so a
        # `json.py` in the scanned repository is not imported in place of the stdlib.
        SCORE=$(python -I -c "import json,sys;print(json.load(open(sys.argv[1])).get('risk_score',''))" "$REPORT_JSON" 2>/dev/null || echo "")
        LEVEL=$(python -I -c "import json,sys;print(json.load(open(sys.argv[1])).get('risk_level',''))" "$REPORT_JSON" 2>/dev/null || echo "")
        echo "risk-score=$SCORE" >> "$GITHUB_OUTPUT"
        echo "risk-level=$LEVEL" >> "$GITHUB_OUTPUT"
        VERDICT=$(python -I -c "import json,sys;print((json.load(open(sys.argv[1])).get('verdict') or {}).get('level',''))" "$REPORT_JSON" 2>/dev/null || echo "")
        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
        echo "SkillTotal: ${LEVEL:-unknown} risk (${SCORE:-?}/100) for '$INPUT_SOURCE'"
        # The findings, in the log too: Code Scanning is off in many repositories, and the log is
        # then the only place a failed gate can be read. Every location of each risk finding (up
        # to 10 per rule), with control characters in file names shown as <U+XXXX>.
        python -I -c "
        import json, sys
        def safe(text):
            return ''.join(c if 32 <= ord(c) < 127 or ord(c) > 159 else '<U+%04X>' % ord(c) for c in str(text))
        r = json.load(open(sys.argv[1], encoding='utf-8'))
        findings = r.get('findings', [])
        risk = [f for f in findings if f.get('threat_class') != 'capability']
        print('Findings: %d risk finding(s); %d capability finding(s), not scored and never gated' % (len(risk), len(findings) - len(risk)))
        for f in risk:
            label = ' (malicious indicator)' if f.get('threat_class') == 'malicious_indicator' else ''
            print('  ' + safe(f.get('severity', '').upper()) + label + ' ' + safe(f.get('id', '')) + ' ' + safe(f.get('title', '')))
            evidence = f.get('evidence') or []
            for ev in evidence[:10]:
                print('      ' + safe(ev.get('file', '')) + (':' + str(ev['line_start']) if ev.get('line_start') else ''))
            if len(evidence) > 10:
                print('      ... and %d more location(s), all of them in the SARIF and JSON reports' % (len(evidence) - 10))
        " "$REPORT_JSON" 2>/dev/null || true
        echo "::$STOP_TOKEN::"

        # 2 = the gate tripped; 1 = collection error. Both should fail the build, but only after
        # the SARIF upload step runs (which is why we defer the failure).
        echo "gate-exit=$GATE_EXIT" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to Code Scanning
      id: upload
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif-upload == 'true' }}
      # The gate decides the job, not the upload. Code Scanning is off in many repositories (a
      # private repository needs GitHub Advanced Security for it), and the upload then fails:
      # that failed every such customer's build, clean or not. The failed upload still shows an
      # error annotation of its own (continue-on-error does not hide it); the next step says why.
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ inputs.sarif-file }}

    - name: Say why the SARIF upload failed
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.upload.outcome == 'failure' }}
      shell: bash
      env:
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        echo "::warning::SkillTotal could not upload SARIF to Code Scanning. Code Scanning may be off for this repository (a private repository needs GitHub Advanced Security), or the job lacks 'security-events: write' (and 'actions: read' in a private repository). The scan and the gate ran as usual; the report is in $INPUT_SARIF_FILE. Set 'upload-sarif: false' to skip the upload."

    - name: Comment on PR
      if: ${{ always() && github.event_name == 'pull_request' && inputs.comment-on-pr == 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REPORT_JSON: ${{ steps.scan.outputs.report-json }}
        UPLOADED: ${{ steps.upload.outcome }}
        GATE_EXIT: ${{ steps.scan.outputs.gate-exit }}
      with:
        script: |
          const fs = require('fs');
          const MARKER = '<!-- skilltotal-report -->';
          let report;
          try {
            report = JSON.parse(fs.readFileSync(process.env.REPORT_JSON, 'utf8'));
          } catch (e) {
            core.info('No SkillTotal report to comment from: ' + e.message);
            return;
          }
          const level = report.risk_level || 'unknown';
          const score = report.risk_score ?? '?';
          // The same count as the step's log: risk findings, and capabilities apart (a capability
          // is what a component can do; it is never scored and never fails the gate).
          const all = report.findings || [];
          const risk = all.filter((f) => f.threat_class !== 'capability');
          const malicious = all.filter((f) => f.threat_class === 'malicious_indicator').length;
          const capFindings = all.length - risk.length;
          const caps = Object.keys(report.capabilities || {});
          const verdict = report.verdict || {};
          const gateExit = process.env.GATE_EXIT || '';
          const gate = gateExit === '0' ? 'passed'
            : gateExit === '2' ? '**failed**'
            : gateExit ? '**error** (exit ' + gateExit + ')' : '**did not run**';
          // Malicious indicators outrank the score: a dropper can score 20/100 (low).
          const icon = verdict.has_malicious_indicators === true ? '🔴'
            : ({ critical: '🔴', high: '🟠', medium: '🟡', low: '🟢' })[level] || '⚪';
          const body = [
            MARKER,
            '## ' + icon + ' SkillTotal — AI component security scan',
            '',
            verdict.headline ? '**Verdict:** ' + verdict.headline : '',
            '**Risk:** ' + level.toUpperCase() + ' (' + score + '/100) · **Gate:** ' + gate,
            '**Findings:** ' + risk.length + ' risk finding(s)'
              + (malicious ? ' (' + malicious + ' malicious indicator(s))' : '')
              + ' · ' + capFindings + ' capability finding(s), not scored',
            caps.length ? '**Capabilities:** ' + caps.join(', ') : '_No notable capabilities detected._',
            '',
            (process.env.UPLOADED === 'success'
              ? 'Detailed results are in the **Security → Code scanning** tab (SARIF). '
              : 'The findings are listed in the log of the SkillTotal step. ') +
              'Deterministic static analysis — [SkillTotal](https://www.skilltotal.ai).',
          ].join('\n');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          try {
            // Every page: on a busy pull request the first page of 30 missed the old comment.
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
          } catch (e) {
            // A pull request from a fork gets a read-only token. The comment is a convenience:
            // the gate and the Code Scanning upload decide the job, not this step.
            core.warning('SkillTotal could not post the pull request comment: ' + e.message);
          }

    - name: Enforce gate
      if: ${{ always() }}
      shell: bash
      env:
        EXIT: ${{ steps.scan.outputs.gate-exit }}
      run: |
        # Empty means the scan step never reached its last line -- the install failed, or the
        # runner killed it. That is a failure, but `exit ""` is a shell error rather than a
        # verdict, so name it instead of letting bash report "numeric argument required".
        if [ -z "$EXIT" ]; then
          echo "::error::SkillTotal did not finish scanning; see the Scan step for the cause."
          exit 1
        fi
        if [ "$EXIT" != "0" ]; then
          echo "::error::SkillTotal gate failed (exit $EXIT). The Scan step's log says which gate tripped and lists the findings (also in Code Scanning when it is on)."
          exit "$EXIT"
        fi
