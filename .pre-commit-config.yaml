# Local guardrails run on `git commit` (install once: `pre-commit install`). The revs follow the
# versions CI pins (.github/requirements/ci.txt, the gitleaks step of ci.yml).
# Layer 1 of secret-leak defense (CI gitleaks + GitHub push protection are layers 2-3).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "skilltotal"]
        pass_filenames: false
