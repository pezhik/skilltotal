version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (auto-PRs bumps), so pinning stays secure
  # without going stale. Also satisfies the OpenSSF Scorecard "Dependency-Update-Tool" check.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # One PR for all action bumps: github/codeql-action's init, analyze and upload-sarif must
    # move together (a mixed pair fails the CodeQL run), and one review beats five.
    groups:
      github-actions:
        patterns: ["*"]
  # The hash-pinned tools the release build, the CI jobs and the release smoke job install
  # (.github/requirements/build.txt, ci.txt, journeys.txt).
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
    groups:
      build-tools:
        patterns: ["*"]
