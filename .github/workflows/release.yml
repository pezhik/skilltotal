name: Release

# Publishes to PyPI on a version tag (vX.Y.Z) using Trusted Publishing (OIDC) — no API
# tokens stored. Configure a PyPI "pending publisher" for this repo/workflow first.
on:
  push:
    tags: ["v*"]

# Least privilege by default; the publish job elevates id-token for OIDC.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Verify the tag matches the package version
        run: |
          PKG=$(python -c "import skilltotal; print(skilltotal.__version__)")
          TAG=${GITHUB_REF_NAME#v}
          test "$PKG" = "$TAG" || { echo "tag $TAG != version $PKG"; exit 1; }
      - name: Run tests before releasing
        run: |
          pip install -e ".[dev]"
          ruff check .
          pytest
          bandit -r skilltotal
      - name: Build sdist + wheel
        run: python -m build
      - name: Check artifacts
        run: twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # Create the GitHub Release for this tag so the Releases page never lags PyPI. Notes are the
  # matching CHANGELOG section (so the release page mirrors the changelog).
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release for this tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create GitHub Release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v hdr="## [$VERSION]" '
            $0==hdr {f=1; next}
            /^## \[/ && f {exit}
            f {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
