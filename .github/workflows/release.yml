name: Release

# Publishes to PyPI on a version tag (vX.Y.Z) using Trusted Publishing (OIDC) — no API
# tokens stored. Configure a PyPI "pending publisher" for this repo/workflow first.
on:
  push:
    tags: ["v*"]

# Least privilege by default; the publish job elevates id-token for OIDC.
permissions:
  contents: read

jobs:
  # A tag publishes only a commit CI has passed. ci.yml runs on every push to main; its run for
  # this exact commit must have finished with every required job green: the unit tests on each
  # Python and on Windows, the journeys, the action, the npm runner and the security scans. A
  # skipped required job is not a pass. A release pushes the commit and its tag together, so this
  # waits while that run is still going.
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: read  # read ci.yml's runs and jobs for this commit
    steps:
      - name: Require a green CI run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          required="test test-windows journeys action npm security secrets"
          # Every required job of a finished run: present (a matrix job counts as "name (...)") and
          # successful. Prints what is missing or not green; exits non-zero then.
          check_run() {
            gh api "repos/$REPO/actions/runs/$1/jobs?filter=latest&per_page=100" --jq '.jobs' \
              > jobs.json
            local ok=0 job jobs
            for job in $required; do
              jobs=$(jq -r --arg j "$job" '.[] | select(.name == $j or (.name | startswith($j + " (")))
                | "\(.conclusion) \(.name)"' jobs.json)
              if [ -z "$jobs" ]; then
                echo "  $job: did not run"; ok=1
              elif grep -v '^success ' <<< "$jobs"; then
                ok=1
              fi
            done
            return $ok
          }
          for attempt in $(seq 1 120); do
            if ! gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=20" \
                --jq '.workflow_runs[] | "\(.id) \(.status) \(.event)"' > runs.txt; then
              echo "GitHub API error; retrying"; sleep 60; continue
            fi
            waiting=0
            while read -r id status event; do
              if [ "$status" != "completed" ]; then waiting=1; continue; fi
              echo "CI run $id ($event):"
              if check_run "$id"; then echo "  every required job passed"; exit 0; fi
            done < runs.txt
            if [ "$waiting" = 0 ]; then
              if [ -s runs.txt ]; then
                echo "::error::CI did not pass for $SHA; fix it and tag a commit CI has passed"
                exit 1
              fi
              echo "no CI run for $SHA yet"
            fi
            sleep 60
          done
          echo "::error::no finished, green CI run for $SHA after two hours"
          exit 1

  # Tests run with the dev dependencies in their own job; the build job below installs nothing but
  # hash-pinned build tools, so a compromised dev or test dependency cannot touch dist/.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify the tag matches the package version
        run: |
          PKG=$(python -c "import skilltotal; print(skilltotal.__version__)")
          TAG=${GITHUB_REF_NAME#v}
          test "$PKG" = "$TAG" || { echo "tag $TAG != version $PKG"; exit 1; }
      - name: Run tests before releasing
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check .
          pytest
          bandit -r skilltotal

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the hash-pinned build tools
        run: python -m pip install --require-hashes --no-deps -r .github/requirements/build.txt
      - name: Build sdist + wheel
        # No isolation: an isolated build would fetch setuptools again, unpinned.
        run: python -m build --no-isolation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Reads the built files only; twine and its many dependencies never run in the build job.
  check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Check artifacts
        run: |
          python -m pip install twine
          twine check dist/*
          # The test suite stays in the repository (MANIFEST.in prunes it from the sdist).
          if tar -tzf dist/*.tar.gz | grep -q '^[^/]*/tests/'; then echo "the sdist ships tests/"; exit 1; fi
      - name: The wheel ships exactly the package's tracked Python files
        # A module left out by the package finder (a folder without __init__.py) imports from a
        # checkout and fails on a customer's machine; a stray file in the build tree ships unseen.
        run: |
          unzip -Z1 dist/*.whl | grep -E '^skilltotal/.*\.py$' | sort > wheel.txt
          git ls-files 'skilltotal/*.py' 'skilltotal/**/*.py' | sort -u > tracked.txt
          diff -u tracked.txt wheel.txt || { echo "::error::wheel files differ from git (+ = only in the wheel)"; exit 1; }

  # The exact files publish uploads, installed into a fresh virtual environment on each OS, on the
  # oldest and the newest supported Python, from the wheel and from the sdist, and driven by the
  # customer journeys through the installed console script (tests/journeys/conftest.py).
  smoke:
    needs: [build, check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
        dist: [wheel, sdist]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Install the built ${{ matrix.dist }} into a fresh virtual environment
        run: |
          case "${{ matrix.dist }}" in
            wheel) ARTIFACT=$(ls dist/*.whl) ;;
            sdist) ARTIFACT=$(ls dist/*.tar.gz) ;;
          esac
          VENV="$RUNNER_TEMP/smoke-venv"
          python -m venv "$VENV"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$VENV/Scripts"; else BIN="$VENV/bin"; fi
          "$BIN/python" -m pip install --upgrade pip
          "$BIN/python" -m pip install "$ARTIFACT"
          # Run outside the checkout, so the installed package answers, not ./skilltotal.
          INSTALLED=$(cd "$RUNNER_TEMP" && "$BIN/skilltotal" --version | tr -d '\r')
          [ "$INSTALLED" = "skilltotal ${GITHUB_REF_NAME#v}" ] \
            || { echo "::error::installed '$INSTALLED', tagged ${GITHUB_REF_NAME#v}"; exit 1; }
          echo "SKILLTOTAL_JOURNEY_CLI=$BIN/skilltotal" >> "$GITHUB_ENV"
      - name: Journeys against the installed CLI
        run: |
          python -m pip install pytest
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          python -m pytest tests/journeys -rs

  publish:
    needs: [ci-passed, build, check, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  # The npm runner (npm/), published with npm Trusted Publishing (OIDC, no stored token) after
  # PyPI has the same version, because it runs `skilltotal==<version>` from PyPI. Off until the
  # repository variable NPM_PUBLISH is "true" (set once the package's trusted publisher is
  # configured on npmjs.com), so a release never fails on a step that cannot work yet.
  npm-publish:
    needs: publish
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write  # OIDC for npm Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Verify the tag matches the npm package version
        working-directory: npm
        run: |
          PKG=$(node -p "require('./package.json').version")
          test "$PKG" = "${GITHUB_REF_NAME#v}" || { echo "tag $GITHUB_REF_NAME != npm $PKG"; exit 1; }
      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public

  # Create the GitHub Release for this tag so the Releases page never lags PyPI. Notes are the
  # matching CHANGELOG section (so the release page mirrors the changelog), with its wrapped lines
  # joined: a Release body renders every newline as a line break.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release for this tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create GitHub Release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md \
            || echo "Release $GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
