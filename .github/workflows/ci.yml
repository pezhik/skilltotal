name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs elevate only what they need (none here — read-only).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Static security scan (bandit)
        run: bandit -r skilltotal

  action:
    # `action.yml` is a shipped artifact -- it is what a Marketplace consumer runs -- and pytest
    # cannot reach it. Exercise it end to end here, including the failure path, because the way
    # this action breaks is by *passing* while reporting nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Clean component passes the gate
        id: clean
        uses: ./
        with:
          source: tests/fixtures/clean_pkg
          fail-on: high
          upload-sarif: false          # this job is read-only; Code Scanning needs security-events
          sarif-file: clean.sarif

      - name: Assert the clean run reported and wrote SARIF
        run: |
          LEVEL='${{ steps.clean.outputs.risk-level }}'
          SCORE='${{ steps.clean.outputs.risk-score }}'
          echo "level=$LEVEL score=$SCORE"
          [ "$LEVEL" = "low" ] || { echo "::error::expected low risk, got '$LEVEL'"; exit 1; }
          [ "$SCORE" = "0" ] || { echo "::error::expected score 0, got '$SCORE'"; exit 1; }
          [ -s clean.sarif ] || { echo "::error::no SARIF written"; exit 1; }

      - name: Risky component trips the gate
        id: risky
        continue-on-error: true
        uses: ./
        with:
          source: tests/fixtures/malicious_npm_pkg
          fail-on: high
          upload-sarif: false
          sarif-file: risky.sarif

      - name: Assert the gate failed AND still reported the risk
        # The second half is the regression that matters: the gate used to abort the scan step
        # under `bash -e`, so the action failed the build (right answer) with empty outputs and a
        # `numeric argument required` shell error (wrong reason, and no risk to report).
        run: |
          OUTCOME='${{ steps.risky.outcome }}'
          LEVEL='${{ steps.risky.outputs.risk-level }}'
          echo "outcome=$OUTCOME level=$LEVEL"
          [ "$OUTCOME" = "failure" ] || { echo "::error::gate did not fail the step"; exit 1; }
          [ -n "$LEVEL" ] || { echo "::error::outputs were empty when the gate tripped"; exit 1; }
          [ -s risky.sarif ] || { echo "::error::no SARIF written for the risky component"; exit 1; }

      - name: Report-only mode reports the same risk without failing
        id: reportonly
        uses: ./
        with:
          source: tests/fixtures/malicious_npm_pkg
          fail-on: none
          upload-sarif: false
          sarif-file: reportonly.sarif

      - name: Assert reporting is decoupled from the gate
        run: |
          LEVEL='${{ steps.reportonly.outputs.risk-level }}'
          echo "level=$LEVEL"
          [ "$LEVEL" = '${{ steps.risky.outputs.risk-level }}' ] \
            || { echo "::error::fail-on changed the reported risk; it must only change the exit"; exit 1; }
          case "$LEVEL" in low|'') echo "::error::expected a risky verdict, got '$LEVEL'"; exit 1 ;; esac

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # full history so secret scanning covers all commits
      - name: Secret scan (gitleaks)
        # Run the binary directly (not the action) so `detect` scans the whole history
        # without the action's commit-range logic, which breaks on the first push (the
        # initial commit has no parent).
        run: |
          GL=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          # -c .gitleaks.toml allowlists this scanner's own fake-secret test fixtures
          # (production paths stay fully scanned).
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact -v --exit-code 1
