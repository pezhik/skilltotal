name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs elevate only what they need (none here — read-only).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  npm:
    # The npm package is a thin runner for the Python engine: test its plan, run it end to end
    # against the engine from this checkout, and check exactly which files it would publish.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the engine
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Test the npm runner
        working-directory: npm
        # The runner prefers uvx/pipx, which fetch the PyPI release matching package.json: on a
        # release commit that version is not published yet (its tag publishes it), and on any other
        # commit they would test the last release, not this checkout. With only Python and Node on
        # PATH, the end-to-end tests run the engine installed from this checkout above.
        run: |
          export PATH="$(dirname "$(command -v python)"):$(dirname "$(command -v node)"):/usr/bin:/bin"
          npm test
      - name: Check the packed file list
        working-directory: npm
        run: |
          npm pack --dry-run --json > pack.json
          python - <<'EOF'
          import json
          files = sorted(f["path"] for f in json.load(open("pack.json"))[0]["files"])
          expected = ["LICENSE", "README.md", "bin/skilltotal.js", "lib/runner.js", "package.json"]
          assert files == expected, files
          EOF

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Static security scan (bandit)
        run: bandit -r skilltotal

  action:
    # `action.yml` is a shipped artifact -- it is what a Marketplace consumer runs -- and pytest
    # cannot reach it. Exercise it end to end here, including the failure path, because the way
    # this action breaks is by *passing* while reporting nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clean component passes the gate
        id: clean
        uses: ./
        with:
          source: tests/fixtures/clean_pkg
          fail-on: high
          upload-sarif: false          # this job is read-only; Code Scanning needs security-events
          sarif-file: clean.sarif

      - name: Assert the clean run reported and wrote SARIF
        run: |
          LEVEL='${{ steps.clean.outputs.risk-level }}'
          SCORE='${{ steps.clean.outputs.risk-score }}'
          echo "level=$LEVEL score=$SCORE"
          [ "$LEVEL" = "low" ] || { echo "::error::expected low risk, got '$LEVEL'"; exit 1; }
          [ "$SCORE" = "0" ] || { echo "::error::expected score 0, got '$SCORE'"; exit 1; }
          [ -s clean.sarif ] || { echo "::error::no SARIF written"; exit 1; }

      - name: A report written inside the scanned folder is not scanned (first run)
        # A customer's workflow scans `.` and writes skilltotal.sarif into it. The second scan of
        # the run, and every later run, must not read that report: its rule descriptions quote
        # detection patterns and failed a clean repository (found in a customer-path test).
        id: inside1
        uses: ./
        with:
          source: tests/fixtures/clean_pkg
          fail-on: high
          upload-sarif: false
          sarif-file: tests/fixtures/clean_pkg/skilltotal.sarif

      - name: A report written inside the scanned folder is not scanned (second run)
        id: inside2
        uses: ./
        with:
          source: tests/fixtures/clean_pkg
          fail-on: high
          upload-sarif: false
          sarif-file: tests/fixtures/clean_pkg/skilltotal.sarif

      - name: Assert both runs stayed clean
        run: |
          for LEVEL in '${{ steps.inside1.outputs.risk-level }}' '${{ steps.inside2.outputs.risk-level }}'; do
            [ "$LEVEL" = "low" ] || { echo "::error::own report was scanned: got '$LEVEL'"; exit 1; }
          done
          [ -s tests/fixtures/clean_pkg/skilltotal.sarif ] || { echo "::error::no SARIF written"; exit 1; }
          [ ! -e skilltotal.json ] || { echo "::error::JSON report written into the workspace"; exit 1; }

      - name: Risky component trips the gate
        id: risky
        continue-on-error: true
        uses: ./
        with:
          source: tests/fixtures/malicious_npm_pkg
          fail-on: high
          upload-sarif: false
          sarif-file: risky.sarif

      - name: Assert the gate failed AND still reported the risk
        # The second half is the regression that matters: the gate used to abort the scan step
        # under `bash -e`, so the action failed the build (right answer) with empty outputs and a
        # `numeric argument required` shell error (wrong reason, and no risk to report).
        run: |
          OUTCOME='${{ steps.risky.outcome }}'
          LEVEL='${{ steps.risky.outputs.risk-level }}'
          echo "outcome=$OUTCOME level=$LEVEL"
          [ "$OUTCOME" = "failure" ] || { echo "::error::gate did not fail the step"; exit 1; }
          [ -n "$LEVEL" ] || { echo "::error::outputs were empty when the gate tripped"; exit 1; }
          [ -s risky.sarif ] || { echo "::error::no SARIF written for the risky component"; exit 1; }

      - name: Report-only mode reports the same risk without failing
        id: reportonly
        uses: ./
        with:
          source: tests/fixtures/malicious_npm_pkg
          fail-on: none
          upload-sarif: false
          sarif-file: reportonly.sarif

      - name: Assert reporting is decoupled from the gate
        run: |
          LEVEL='${{ steps.reportonly.outputs.risk-level }}'
          echo "level=$LEVEL"
          [ "$LEVEL" = '${{ steps.risky.outputs.risk-level }}' ] \
            || { echo "::error::fail-on changed the reported risk; it must only change the exit"; exit 1; }
          case "$LEVEL" in low|'') echo "::error::expected a risky verdict, got '$LEVEL'"; exit 1 ;; esac

      - name: An unknown fail-on level fails instead of switching the gate off
        id: badlevel
        continue-on-error: true
        uses: ./
        with:
          source: tests/fixtures/malicious_npm_pkg
          fail-on: hihg
          upload-sarif: false
          sarif-file: badlevel.sarif

      - name: Assert the typo failed the job
        run: |
          [ '${{ steps.badlevel.outcome }}' = "failure" ] \
            || { echo "::error::a misspelled fail-on level let the job pass"; exit 1; }

      - name: Source text is passed as data, never run as shell
        # A workflow may hand the action untrusted text (an issue title, a branch name). It reaches
        # the shell only through env, so `$(…)` in it is a path that does not exist, not a command.
        id: inject
        continue-on-error: true
        uses: ./
        with:
          source: "nothing-here-$(touch injected.txt)"
          fail-on: none
          upload-sarif: false
          sarif-file: inject.sarif

      - name: Assert nothing was executed
        run: |
          [ ! -e injected.txt ] || { echo "::error::the source input was executed as shell"; exit 1; }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history so secret scanning covers all commits
      - name: Secret scan (gitleaks)
        # Run the binary directly (not the action) so `detect` scans the whole history
        # without the action's commit-range logic, which breaks on the first push (the
        # initial commit has no parent).
        run: |
          GL=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          # -c .gitleaks.toml allowlists this scanner's own fake-secret test fixtures
          # (production paths stay fully scanned).
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact -v --exit-code 1
