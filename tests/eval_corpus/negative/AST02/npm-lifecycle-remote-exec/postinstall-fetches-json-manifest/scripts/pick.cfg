// FIXTURE ONLY — synthetic detection test sample, not real malware
// Reads the release manifest, picks the prebuilt binary for this platform and saves its name.
// The response is parsed and matched, never run.
const fs = require("fs");
const { execFileSync } = require("child_process");
require("https").get("https://releases.example.invalid/manifest.json", (res) => {
  let body = "";
  res.on("data", (chunk) => (body += chunk));
  res.on("end", () => {
    const version = /"version":\s*"([^"]+)"/.exec(body);
    const manifest = JSON.parse(body);
    fs.writeFileSync("prebuilt.json", JSON.stringify(manifest[process.platform] || {}));
    execFileSync("node", ["scripts/verify.js", version ? version[1] : "0.0.0"]);
  });
});
