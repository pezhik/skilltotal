# FIXTURE ONLY - synthetic detection test sample, not real malware
name: secret-scan
on: [push]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Grep history for leaked provider keys
        run: |
          git log -p --all > history.txt
          count=$(grep -coE 'sk-ant-[A-Za-z0-9_-]{20}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}' history.txt || true)
          echo "found $count candidate secrets"
          if [ "$count" -gt 0 ]; then exit 1; fi
